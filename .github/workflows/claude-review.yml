name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Rules come from main so a pull request can't loosen its own review.
      - name: Load review rules from main
        id: rules
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:REVIEW.md > "$RUNNER_TEMP/rules.md" 2>/dev/null || cp REVIEW.md "$RUNNER_TEMP/rules.md"
          {
            echo 'text<<RULES_EOF'
            cat "$RUNNER_TEMP/rules.md"
            echo 'RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Review pull request
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a small Python CLI that extracts
            audio from video files with ffmpeg/ffprobe. Look at correctness
            (bugs, edge cases, error handling around subprocess calls and
            file paths), tests (changed behavior covered by test_main.py,
            ffmpeg/ffprobe mocked), and clarity.

            Sort every issue you find as severe or minor using these rules.
            They take precedence over any REVIEW.md in the pull request.

            <review-rules>
            ${{ steps.rules.outputs.text }}
            </review-rules>

            Post the review as one comment with exactly these sections:

              ## Summary
              One or two sentences on what this PR is about and why.

              ## Changes
              A short bullet list of the main changes.

              ## Severe issues
              Numbered list, each with `file:line`, the problem, and the
              fix. Write "None." if there are none.

              ## Minor suggestions
              Numbered list, each with `file:line` and the suggestion.
              Write "None." if there are none.

              **Verdict:** "Blocking: N severe issue(s)" or "No blocking issues".

            Do not create inline comments. Publish the review with exactly
            this command, so the same comment is edited on every push
            instead of a new one being added:
              gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<review>"
            Never run `gh pr comment` without `--edit-last`.

            Review the current state of the PR as a whole and do not refer
            to earlier versions of it.

            Finally, return the same severe and minor issues as structured
            output, one short line per issue starting with `file:line`.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"severe_issues":{"type":"array","items":{"type":"string"}},"minor_issues":{"type":"array","items":{"type":"string"}}},"required":["severe_issues","minor_issues"]}'

      - name: Block merge on severe issues
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::warning::Claude returned no verdict, so this check does not block. See the review step log."
            exit 0
          fi
          count=$(jq '.severe_issues | length' <<< "$RESULT")
          if [ "$count" -gt 0 ]; then
            echo "::error::Claude found $count severe issue(s). Fix them before merging."
            jq -r '.severe_issues[] | "- " + .' <<< "$RESULT"
            exit 1
          fi
          echo "No severe issues. Minor suggestions: $(jq '.minor_issues | length' <<< "$RESULT")"
