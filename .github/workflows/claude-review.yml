name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a small Python CLI that extracts
            audio from video files with ffmpeg/ffprobe. Focus on:

            1. Correctness: bugs, edge cases, and error handling around
               subprocess calls and file paths.
            2. Tests: whether changed behavior is covered by test_main.py,
               and whether tests mock ffmpeg/ffprobe rather than needing
               real media.
            3. Clarity: naming, structure, and anything needlessly complex.

            Use inline comments for specific issues and one short summary
            comment for the overall verdict. Skip nitpicks and don't
            restate what the diff already shows.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
