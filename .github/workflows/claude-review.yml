name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A newer push supersedes any review still running for the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Rules come from main so a pull request can't loosen its own review.
      - name: Load review rules from main
        id: rules
        run: |
          git fetch --depth=1 origin main
          git show FETCH_HEAD:REVIEW.md > "$RUNNER_TEMP/rules.md" 2>/dev/null || cp REVIEW.md "$RUNNER_TEMP/rules.md"
          {
            echo 'text<<RULES_EOF'
            cat "$RUNNER_TEMP/rules.md"
            echo 'RULES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Claude only reads the PR. Posting and gating happen in the steps below.
      - name: Review pull request
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for a small Python CLI that extracts
            audio from video files with ffmpeg/ffprobe. Look at correctness
            (bugs, edge cases, error handling around subprocess calls and
            file paths), tests (changed behavior covered by test_main.py,
            ffmpeg/ffprobe mocked), and clarity.

            Sort every issue you find as severe or minor, and format the
            review, using these rules. They take precedence over any
            REVIEW.md in the pull request.

            <review-rules>
            ${{ steps.rules.outputs.text }}
            </review-rules>

            Do not post anything to GitHub. Return your result as structured
            output:

            - `severe_issues` and `minor_issues`: one short line per issue,
              starting with `file:line`.
            - `review`: the review in Markdown, following the "Review format"
              section of the rules exactly.

            Review the current state of the PR as a whole and do not refer
            to earlier versions of it.
          claude_args: |
            --model claude-opus-5-5
            --effort high
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"review":{"type":"string"},"severe_issues":{"type":"array","items":{"type":"string"}},"minor_issues":{"type":"array","items":{"type":"string"}}},"required":["review","severe_issues","minor_issues"]}'

      # Posts a new "Comment" review, then hides older ones so only the latest shows.
      - name: Post review
        if: steps.review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.review.outputs.structured_output }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          marker='<!-- claude-review -->'
          new_id=$(jq --arg marker "$marker" '{event: "COMMENT", body: ($marker + "\n" + .review)}' <<< "$RESULT" |
            gh api "repos/$REPO/pulls/$PR/reviews" --input - --jq .id)

          gh api --paginate "repos/$REPO/pulls/$PR/reviews" |
            jq -r --arg marker "$marker" --argjson new "$new_id" '.[]
              | select(.user.login == "github-actions[bot]" and .id != $new and (.body | contains($marker)))
              | .node_id' |
          while read -r node_id; do
            gh api graphql -f id="$node_id" -f query='
              mutation($id: ID!) {
                minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                  minimizedComment { isMinimized }
                }
              }' > /dev/null || echo "::warning::Could not hide old review $node_id"
          done

      - name: Block merge on severe issues
        env:
          RESULT: ${{ steps.review.outputs.structured_output }}
        run: |
          if [ -z "$RESULT" ]; then
            echo "::warning::Claude returned no verdict, so this check does not block. See the review step log."
            exit 0
          fi
          count=$(jq '.severe_issues | length' <<< "$RESULT")
          if [ "$count" -gt 0 ]; then
            echo "::error::Claude found $count severe issue(s). Fix them before merging."
            jq -r '.severe_issues[] | "- " + .' <<< "$RESULT"
            exit 1
          fi
          echo "No severe issues. Minor suggestions: $(jq '.minor_issues | length' <<< "$RESULT")"
